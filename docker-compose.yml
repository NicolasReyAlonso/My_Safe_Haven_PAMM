services:
  db:
    image: postgres:17
    container_name: mysafehaven-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nicololo
      POSTGRES_DB: mysafehaven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mysafehaven"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./Backend/
    container_name: mysafehaven-backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Nicololo
      POSTGRES_DB: mysafehaven
    ports:
      - "5050:5050"
    volumes:
      - uploads_data:/app/my_safe_haven_back/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
